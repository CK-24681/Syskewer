# ===============================
# CONFIGURAÇÃO DE BANCO DE DADOS EM MEMÓRIA PARA TESTES (H2 - Compatibilidade PostgreSQL)
# ===============================
spring.application.name=api-test

spring.datasource.url=jdbc:h2:mem:syskewer_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# ===============================
# CONFIGURAÇÃO DE E-MAIL (MOCK/TESTE)
# ===============================
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=teste@syskewer.com
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

