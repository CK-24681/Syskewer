version: '3.8'

services:
  db:
    image: postgres:15
    container_name: syskewer-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: charles24681
      POSTGRES_DB: syskewer_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    container_name: syskewer-api
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/syskewer_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=charles24681
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    depends_on:
      - db

volumes:
  postgres_data: